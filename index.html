<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf7f8">
<title>Sweepstakes HQ</title>
<style>
:root{--bg:#faf7f8;--card:#fff;--ink:#282329;--muted:#786f76;--accent:#8b6071;--soft:#f2e7eb;--ok:#e2efe8;--danger:#9b4550;--line:#eadfe3}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:760px;margin:auto;padding:22px 16px 70px}.hero h1{font-size:30px;margin:0}.hero p{color:var(--muted);margin:5px 0 18px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;background:var(--accent);width:0}
.tabs,.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:18px 0 10px}.tab,.button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:11px 13px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}
.tab.active,.primary{background:var(--ink);color:white;border-color:var(--ink)}.accent{background:var(--soft)}.success{background:var(--ok)}
.danger{color:var(--danger)}.toolbar{justify-content:space-between;align-items:center}.top{display:flex;justify-content:space-between;gap:12px}.title{font-size:18px;font-weight:800}
.badge{font-size:12px;background:var(--soft);padding:6px 9px;border-radius:99px;white-space:nowrap;height:max-content}.meta,.small{color:var(--muted);font-size:13px;line-height:1.5}.meta{margin:7px 0 11px}
.note{background:#faf6f7;border-radius:12px;padding:10px;font-size:13px;margin-bottom:12px}.actions>*{flex:1;text-align:center;min-width:125px}
.hidden{display:none}.empty{text-align:center;color:var(--muted);padding:30px 10px}
dialog{border:0;border-radius:22px;padding:0;width:min(94%,560px);box-shadow:0 20px 60px #0003}dialog::backdrop{background:#0006}.modal{padding:20px}
label{display:block;font-size:13px;font-weight:700;margin:13px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit;background:white}textarea{min-height:78px;resize:vertical}
.form-actions{display:flex;gap:8px;margin-top:18px}.form-actions button{flex:1}.stats{display:flex;gap:16px;color:var(--muted);font-size:13px;margin-top:8px}
footer{color:var(--muted);font-size:12px;line-height:1.5;margin:24px 4px}
</style>
</head>
<body><main>
<section class="hero"><h1>✨ Sweepstakes HQ</h1><p>Your private daily giveaway command center.</p></section>

<section class="panel">
 <strong id="progressText"></strong>
 <div class="bar"><div class="fill" id="fill"></div></div>
 <div class="stats"><span id="todayCount"></span><span id="totalCount"></span></div>
</section>

<div class="toolbar">
 <div class="tabs">
  <button class="tab active" data-tab="daily">Daily</button>
  <button class="tab" data-tab="recurring">Recurring</button>
  <button class="tab" data-tab="one">One-Time</button>
  <button class="tab" data-tab="ended">Ended</button>
 </div>
 <button class="button primary" id="addBtn">＋ Add Giveaway</button>
</div>

<section id="daily"></section><section id="recurring" class="hidden"></section><section id="one" class="hidden"></section><section id="ended" class="hidden"></section>

<footer>Your data is saved locally in this browser/device. Sweepstakes HQ does not submit entries for you. Use the official rules for eligibility, limits, and deadlines.</footer>
</main>

<dialog id="editor"><form class="modal" id="form">
<h2 id="formTitle" style="margin:0">Add Giveaway</h2>
<input type="hidden" id="editId">
<label for="name">Giveaway name *</label><input id="name" required>
<label for="prize">Prize</label><input id="prize" placeholder="$5,000, trip, beauty bundle…">
<label for="type">Entry type</label><select id="type"><option value="daily">Daily / Repeat</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="one">One-Time</option></select>
<label for="deadline">Deadline</label><input id="deadline" type="date">
<label for="url">Official entry page</label><input id="url" type="url" placeholder="https://…">
<label for="note">Instructions / notes</label><textarea id="note" placeholder="AMOE first, select Patriots, winner notification details…"></textarea>
<div class="form-actions"><button type="button" class="button" id="cancel">Cancel</button><button class="button primary" type="submit">Save Giveaway</button></div>
</form></dialog>

<script>
const defaults=[
{id:"amazon-haul",type:"daily",name:"Amazon Haul Car Sweepstakes",prize:"$50,000 cash or eligible vehicle",deadline:"2026-10-01",note:"Tap “Enter for Free.” First 5 daily qualifications create your first entry; later daily qualifications become bonus entries.",url:"https://www.amazon.com/b?node=222015503011&ishaul=1&ref_=hul_swpstk_lp_ofclrl"},
{id:"frito",type:"daily",name:"Frito-Lay Gameday Experiences",prize:"Patriots / Boston trip",deadline:"2026-12-06",note:"AMOE first → get free code → main entry → select Patriots → submit.",url:"https://tostitosgamedayexperiences.com"},
{id:"coke",type:"daily",name:"Coca-Cola",prize:"Current official promotions",deadline:"",note:"Use the official Coca-Cola promotions hub.",url:"https://www.coca-cola.com/us/en/offerings"},
{id:"food",type:"daily",name:"Food.com",prize:"Ongoing/repeat-entry giveaway",deadline:"",note:"Complete today’s permitted entry.",url:"https://www.food.com"},
{id:"valpak",type:"daily",name:"Valpak",prize:"Ongoing/repeat-entry giveaway",deadline:"",note:"Complete today’s permitted entry.",url:"https://www.valpak.com"},
{id:"people",type:"one",name:"PEOPLE Beauty Awards",prize:"Beauty Awards assortment",deadline:"2026-10-16",note:"Entered ✓",url:""},
{id:"loreal",type:"one",name:"L’Oréal EverPure Iron Sleek",prize:"L’Oréal prize package",deadline:"2026-09-20",note:"Entered ✓",url:""},
{id:"instax",type:"one",name:"FUJIFILM instax Capture the Joy",prize:"instax mini camera + film",deadline:"2026-09-20",note:"Entered ✓",url:""}
];
let items;
try{items=JSON.parse(localStorage.getItem("swhq_items"))||defaults}catch(e){items=defaults}
function save(){localStorage.setItem("swhq_items",JSON.stringify(items))}
function today(){return new Date().toLocaleDateString("en-CA")}
function weekKey(){const d=new Date();const jan1=new Date(d.getFullYear(),0,1);const n=Math.ceil((((d-jan1)/86400000)+jan1.getDay()+1)/7);return d.getFullYear()+"-W"+String(n).padStart(2,"0")}function monthKey(){const d=new Date();return d.getFullYear()+"-M"+String(d.getMonth()+1).padStart(2,"0")}function periodKey(type){if(type==="weekly")return weekKey();if(type==="monthly")return monthKey();return today()}function doneKey(id,type="daily"){return "swhq_done:"+periodKey(type)+":"+id}
function countKey(id){return "swhq_count:"+id}
function daysLeft(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);const end=new Date(y,m-1,d,23,59,59);return Math.ceil((end-new Date())/86400000)}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:"#"}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){
 ["daily","recurring","one","ended"].forEach(x=>document.getElementById(x).innerHTML="");
 items.forEach(x=>{
  const dl=daysLeft(x.deadline), ended=dl!==null&&dl<0, section=ended?"ended":x.type;
  const checked=localStorage.getItem(doneKey(x.id,x.type))==="1", count=+(localStorage.getItem(countKey(x.id))||0);
  const deadline=x.deadline?`${esc(x.deadline)} • ${Math.max(0,dl)} day${Math.max(0,dl)==1?"":"s"} left`:"No deadline saved";
  const card=document.createElement("article");card.className="card";
  card.innerHTML=`<div class="top"><div><div class="title">${esc(x.name)}</div><div class="meta"><b>${esc(x.prize||"Prize not entered")}</b><br>${deadline}</div></div><span class="badge">${x.type==="daily"?"Daily":x.type==="weekly"?"Weekly":x.type==="monthly"?"Monthly":section==="one"?"One-Time":"Ended"}</span></div>
  ${x.note?`<div class="note">${esc(x.note)}</div>`:""}
  ${section==="daily"||section==="recurring"?`<div class="actions">${x.url?`<a class="button primary" target="_blank" rel="noopener" href="${safeUrl(x.url)}">Open Entry Page</a>`:""}<button class="button ${checked?"success":"accent"} toggle" data-id="${x.id}">${checked?(x.type==="weekly"?"✓ Entered This Week":x.type==="monthly"?"✓ Entered This Month":"✓ Entered Today"):"Mark Entered"}</button></div><div class="small">Tracked entries: ${count}</div>`:""}
  <div class="actions" style="margin-top:9px"><button class="button edit" data-id="${x.id}">Edit</button><button class="button danger delete" data-id="${x.id}">Delete</button></div>`;
  document.getElementById(section).appendChild(card);
 });
 ["daily","recurring","one","ended"].forEach(s=>{if(!document.getElementById(s).children.length)document.getElementById(s).innerHTML='<div class="empty">Nothing here yet.</div>'});
 document.querySelectorAll(".toggle").forEach(b=>b.addEventListener("click",()=>{
  const k=doneKey(b.dataset.id), ck=localStorage.getItem(k)==="1", c=countKey(b.dataset.id), n=+(localStorage.getItem(c)||0);
  if(ck){localStorage.removeItem(k);localStorage.setItem(c,Math.max(0,n-1))}else{localStorage.setItem(k,"1");localStorage.setItem(c,n+1)} render();
 }));
 document.querySelectorAll(".edit").forEach(b=>b.addEventListener("click",()=>openEditor(b.dataset.id)));
 document.querySelectorAll(".delete").forEach(b=>b.addEventListener("click",()=>{const x=items.find(i=>i.id===b.dataset.id);if(confirm(`Delete “${x.name}”?`)){items=items.filter(i=>i.id!==b.dataset.id);save();render()}}));
 const active=items.filter(x=>x.type==="daily"&&(daysLeft(x.deadline)===null||daysLeft(x.deadline)>=0));
 const n=active.filter(x=>localStorage.getItem(doneKey(x.id,"daily"))==="1").length;
 const total=active.reduce((a,x)=>a+(+(localStorage.getItem(countKey(x.id))||0)),0);
 document.getElementById("progressText").textContent=`${n}/${active.length} dailies completed today`;
 document.getElementById("fill").style.width=(active.length?n/active.length*100:0)+"%";
 document.getElementById("todayCount").textContent=`Today: ${n} entries`;
 const recurring=items.filter(x=>(x.type==="weekly"||x.type==="monthly")&&(daysLeft(x.deadline)===null||daysLeft(x.deadline)>=0));const rn=recurring.filter(x=>localStorage.getItem(doneKey(x.id,x.type))==="1").length;document.getElementById("totalCount").textContent=`Tracked total: ${total} • Recurring: ${rn}/${recurring.length} due this period`;
}
const dlg=document.getElementById("editor"), form=document.getElementById("form");
function openEditor(id=""){
 const x=items.find(i=>i.id===id);
 document.getElementById("formTitle").textContent=x?"Edit Giveaway":"Add Giveaway";
 document.getElementById("editId").value=x?.id||"";
 ["name","prize","type","deadline","url","note"].forEach(k=>document.getElementById(k).value=x?.[k]|| (k==="type"?"daily":""));
 dlg.showModal();
}
document.getElementById("addBtn").addEventListener("click",()=>openEditor());
document.getElementById("cancel").addEventListener("click",()=>dlg.close());
form.addEventListener("submit",e=>{
 e.preventDefault();const old=document.getElementById("editId").value;
 const obj={id:old||"g"+Date.now(),name:document.getElementById("name").value.trim(),prize:document.getElementById("prize").value.trim(),type:document.getElementById("type").value,deadline:document.getElementById("deadline").value,url:document.getElementById("url").value.trim(),note:document.getElementById("note").value.trim()};
 if(!obj.name)return;
 if(old)items=items.map(x=>x.id===old?obj:x);else items.push(obj);
 save();dlg.close();form.reset();render();
});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");["daily","recurring","one","ended"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==t.dataset.tab))}));
render();
</script></body></html>
